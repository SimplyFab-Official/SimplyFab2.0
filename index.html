        function getInquiries() {
            const saved = localStorage.getItem('sf_inquiries_tracker');

        function getRegisteredUsers() {
            const saved = localStorage.getItem('sf_registered_users');

        window.previewPhpConversion = function() {
            const vndInput = parseFloat(document.getElementById('new-price-vnd').value) || 0;
            const phpValue = vndInput * VND_TO_PHP_RATIO;
            document.getElementById('vnd-conversion-preview').textContent = 
                `Equivalent: ₱${phpValue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} PHP (Rate: 800 VND = 2 PHP)`;
        }

        window.handleVisitorLogin = function(event) {
            event.preventDefault();
            const name = document.getElementById('visitor-name').value.trim();
            const phone = document.getElementById('visitor-phone').value.trim();
            
            if (name && phone) {
                if (name.toLowerCase() === ADMIN_NAME.toLowerCase() && phone === ADMIN_PHONE) {
                    localStorage.setItem('sf_logged_user', JSON.stringify({ name, phone, isAdmin: true }));
                    document.getElementById('login-modal').style.display = 'none';
                    activateAdminMode();
                    alert("Welcome Admin! Successfully recognized and redirected to the admin console.");
                    window.location.hash = "#catalog";
                    return;
                }

                const dateRegistered = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                localStorage.setItem('sf_logged_user', JSON.stringify({ name, phone, isAdmin: false }));
                
                let users = getRegisteredUsers();
                if (!users.some(u => u.phone === phone)) {
                    users.unshift({ dateRegistered, name, phone });
                    localStorage.setItem('sf_registered_users', JSON.stringify(users));
                }

                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('client-name').value = name;
                document.getElementById('client-phone').value = phone;
            }
        }

        function checkVisitorSession() {
            const user = localStorage.getItem('sf_logged_user');
            if (user) {
                document.getElementById('login-modal').style.display = 'none';
                const parsed = JSON.parse(user);
                
                if (parsed.isAdmin) {
                    activateAdminMode();
                } else {
                    document.getElementById('client-name').value = parsed.name;
                    document.getElementById('client-phone').value = parsed.phone;
                }
            } else {
                document.getElementById('login-modal').style.display = 'flex';
            }
        }

        function activateAdminMode() {
            const panels = ['admin-panel-catalog', 'admin-panel-users', 'admin-panel-qrs', 'admin-panel-tracker', 'admin-panel-contact'];
            panels.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('active');
            });
            const root = document.getElementById('body-root');
            if (root) root.classList.add('admin-mode');
            const toggleBtn = document.getElementById('admin-toggle-btn-ui');
            if (toggleBtn) toggleBtn.style.display = 'inline-block';
            renderRegisteredUsers();
            renderTracker();
        }

        window.toggleAdminPanel = function() {
            const panels = ['admin-panel-catalog', 'admin-panel-users', 'admin-panel-qrs', 'admin-panel-tracker', 'admin-panel-contact'];
            const firstPanel = document.getElementById('admin-panel-catalog');
            const isActive = firstPanel ? firstPanel.classList.contains('active') : false;
            
            panels.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    if (isActive) {
                        el.classList.remove('active');
                    } else {
                        el.classList.add('active');
                    }
                }
            });
            if (!isActive) {
                renderRegisteredUsers();
                renderTracker();
            }
        }

        function renderRegisteredUsers() {
            const tbody = document.getElementById('registered-users-table-body');
            if (!tbody) return;
            const users = getRegisteredUsers();

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #777;">No registered users yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.dateRegistered}</td>
                    <td><strong>${user.name}</strong></td>
                    <td>${user.phone}</td>
                </tr>
            `).join('');
        }

        window.exportRegisteredUsersCSV = function() {
            const users = getRegisteredUsers();
            if (users.length === 0) {
                alert("No registered users to export.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Registration Date,Full Name,Phone Number\r\n";
            users.forEach(user => {
                csvContent += `"${user.dateRegistered}","${user.name}","${user.phone}"\r\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "registered_users_simply_fab.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            if (!grid) return;
            let gowns = liveGownsCatalog.length > 0 ? liveGownsCatalog : defaultGowns;

            if (gowns.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #777;">No dresses available in the catalog.</p>`;
                return;
            }

            grid.innerHTML = gowns.map(gown => {
                const images = gown.images || [gown.img];
                let mediaHtml = images.map((imgUrl) => `<img src="${imgUrl}" alt="${gown.name}">`).join('');
                if (gown.video) {
                    mediaHtml += `<video src="${gown.video}" controls muted></video>`;
                }

                const totalSlides = images.length + (gown.video ? 1 : 0);
                const carouselControls = totalSlides > 1 ? `
                    <button class="carousel-btn prev" onclick="slideMedia('${gown.id}', -1)">&#10094;</button>
                    <button class="carousel-btn next" onclick="slideMedia('${gown.id}', 1)">&#10095;</button>
                ` : '';

                return `
                    <div class="card" id="card-${gown.id}">
                        <button class="btn-delete-item" onclick="deleteGown('${gown.id}')" title="Delete item">×</button>
                        <div class="carousel-container" data-index="0" data-total="${totalSlides}">
                            <div class="carousel-track" id="track-${gown.id}">
                                ${mediaHtml}
                            </div>
                            ${carouselControls}
                        </div>
                        <div class="card-body">
                            <h3>${gown.name}</h3>
                            <p>${gown.desc}</p>
                            <div class="price">₱${parseFloat(gown.price).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                            <button class="btn-cart" onclick="addToCart('${gown.id}')">Add to Cart 🛍️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.slideMedia = function(gownId, direction) {
            const card = document.getElementById(`card-${gownId}`);
            if (!card) return;
            const container = card.querySelector('.carousel-container');
            const track = document.getElementById(`track-${gownId}`);
            let currentIndex = parseInt(container.getAttribute('data-index'));
            let totalSlides = parseInt(container.getAttribute('data-total'));

            track.querySelectorAll('video').forEach(v => v.pause());

            currentIndex = (currentIndex + direction + totalSlides) % totalSlides;
            container.setAttribute('data-index', currentIndex);
            
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        window.addToCart = function(id) {
            const gowns = liveGownsCatalog.length > 0 ? liveGownsCatalog : defaultGowns;
            const gown = gowns.find(g => String(g.id) === String(id));
            if (!gown) return;
            const existing = cart.find(item => String(item.id) === String(id));

            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...gown, qty: 1 });
            }

            renderCart();
            alert(`"${gown.name}" has been added to your cart!`);
        }

        window.updateCartQty = function(id, delta) {
            const item = cart.find(i => String(i.id) === String(id));
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => String(i.id) !== String(id));
                }
            }
            renderCart();
        }

        window.removeFromCart = function(id) {
            cart = cart.filter(i => String(i.id) !== String(id));
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cart-items-body');
            const totalDisplay = document.getElementById('cart-total-display');
            if (!tbody || !totalDisplay) return;

            if (cart.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #777;">Your cart is empty. Add a dress from the catalog above!</td></tr>`;
                totalDisplay.textContent = "0.00";
                return;
            }

            let total = 0;
            tbody.innerHTML = cart.map(item => {
                const itemTotal = parseFloat(item.price) * item.qty;
                total += itemTotal;
                return `
                    <tr>
                        <td><strong>${item.name}</strong> - ${item.desc}</td>
                        <td>
                            <button type="button" onclick="updateCartQty('${item.id}', -1)" style="padding: 2px 6px;">-</button>
                            <span style="margin: 0 6px;">${item.qty}</span>
                            <button type="button" onclick="updateCartQty('${item.id}', 1)" style="padding: 2px 6px;">+</button>
                        </td>
                        <td>₱${itemTotal.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                        <td><button type="button" class="btn-action" onclick="removeFromCart('${item.id}')" style="color: #a00; border:none; background:none; font-weight:bold; cursor:pointer;">×</button></td>
                    </tr>
                `;
            }).join('');

            totalDisplay.textContent = total.toLocaleString('en-US', {minimumFractionDigits: 2});
        }

            } else if (method === 'Maya') {
                qrBox.style.display = 'block';

                qrImg.src = mayaQR || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80';

                qrBox.style.display = 'none';

        window.uploadQR = function(type, event) {
            const file = event.target.files[0];
            if (file) {
                resizeImage(file, 400, 400, 0.7, function(base64) {
                    if (type === 'gcash') {
                        localStorage.setItem('sf_qr_gcash', base64);
                        document.getElementById('admin-gcash-preview').src = base64;
                    } else {

                        document.getElementById('admin-maya-preview').src = base64;
                    }
                    alert(`${type.toUpperCase()} QR Code updated successfully!`);
                    handlePaymentChange();

        // Image compression helper function
        function resizeImage(file, maxWidth, maxHeight, quality, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.handleAddNewGown = async function(event) {
            event.preventDefault();
            const name = document.getElementById('new-name').value;
            const desc = document.getElementById('new-desc').value;
            const priceVndInput = parseFloat(document.getElementById('new-price-vnd').value) || 0;
            const pricePhp = (priceVndInput * VND_TO_PHP_RATIO).toFixed(2);

            const fileInput = document.getElementById('new-imgs');
            const videoInput = document.getElementById('new-video');

            const files = Array.from(fileInput.files);
            if (files.length < 3) {
                alert("Please select at least 3 pictures for the product.");
                return;
            }

            let loadedImages = [];
            let loadedVideo = "";
            let processedImages = 0;

            async function finalizeGown() {
                const newGown = {
                    name,
                    desc,
                    price: pricePhp,
                    images: loadedImages,
                    video: loadedVideo,
                    createdAt: Date.now()
                };

                try {
                    await addDoc(collection(db, "gowns_catalog"), newGown);
                    event.target.reset();
                    previewPhpConversion();
                    alert(`New dress published successfully to Firebase with compressed images!\nConverted ${priceVndInput.toLocaleString()} VND to ₱${pricePhp} PHP.`);
                } catch (e) {
                    console.error("Error adding document to Firebase: ", e);
                    alert("Error publishing dress to database. Check console.");
                }
            }

            if (videoInput.files && videoInput.files[0]) {
                const videoReader = new FileReader();
                videoReader.onload = function(e) {
                    loadedVideo = e.target.result;
                    checkCompletion();
                };
                videoReader.readAsDataURL(videoInput.files[0]);
            } else {
                checkCompletion();
            }

            files.forEach((file, index) => {
                resizeImage(file, 800, 800, 0.75, function(compressedDataUrl) {
                    loadedImages[index] = compressedDataUrl;
                    processedImages++;
                    checkCompletion();
                });
            });

            function checkCompletion() {
                const videoReady = (!videoInput.files[0] || loadedVideo !== "");
                if (processedImages === files.length && videoReady) {
                    finalizeGown();
                }
            }
        }

        window.handleUpdateContact = function(event) {
            event.preventDefault();
            const web = document.getElementById('admin-web').value;
            const email = document.getElementById('admin-email').value;
            const phone = document.getElementById('admin-phone').value;

            const contactInfo = { web, email, phone };
            localStorage.setItem('sf_contact_info', JSON.stringify(contactInfo));
            
            loadContactInfo();
            alert("Contact details updated successfully!");
        }

        window.handleCheckout = function(event) {
            event.preventDefault();
            if (cart.length === 0) {
                alert("Your cart is empty! Please select at least one dress.");
                return;
            }

            const name = document.getElementById('client-name').value;
            const phone = document.getElementById('client-phone').value;
            const shippingAddress = document.getElementById('shipping-address').value;
            const paymentMethod = document.getElementById('payment-method').value;
            const dateSubmitted = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

            const itemsSummary = cart.map(i => `${i.name} (x${i.qty})`).join(', ');

            const newOrder = {
                id: Date.now(),
                dateSubmitted,
                name,
                phone,
                shippingAddress,
                itemsSummary,
                paymentMethod,
                status: 'Pending'
            };

            let inquiries = getInquiries();
            inquiries.unshift(newOrder);
            localStorage.setItem('sf_inquiries_tracker', JSON.stringify(inquiries));
            renderTracker();

            const contactInfo = JSON.parse(localStorage.getItem('sf_contact_info')) || { email: "tin23_angela@gmail.com" };
            alert(`Order successfully placed, ${name}!\n\n[Notification sent to company email: ${contactInfo.email}]\nPayment via: ${paymentMethod}\nStatus: PENDING approval.`);
            
            cart = [];
            renderCart();
            event.target.reset();
            handlePaymentChange();
        }

        window.updateStatus = function(id, newStatus) {
            let inquiries = getInquiries();
            const order = inquiries.find(i => i.id === id);
            if (order) {
                order.status = newStatus;
                localStorage.setItem('sf_inquiries_tracker', JSON.stringify(inquiries));
            }
        }

        window.deleteGown = async function(id) {
            if (confirm("Remove this dress from catalog?")) {
                try {
                    await deleteDoc(doc(db, "gowns_catalog", id));
                    alert("Dress removed from Firebase successfully!");
                } catch (e) {
                    console.error("Error removing document: ", e);
                    alert("Failed to delete from database.");
                }
            }
        }

        function initRealtimeCatalog() {
            onSnapshot(collection(db, "gowns_catalog"), (snapshot) => {
                let gowns = [];
                snapshot.forEach((docSnap) => {
                    gowns.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                liveGownsCatalog = gowns;
                renderCatalog();
            }, (error) => {
                console.error("Error listening to Firestore catalog changes: ", error);
            });
        }

        checkVisitorSession();
        initRealtimeCatalog();
        renderCart();
        renderTracker();
        renderRegisteredUsers();
        loadContactInfo();
        loadQRs();
    </script>
